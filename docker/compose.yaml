# 本地开发用 MySQL
# 用法（在仓库根目录）：docker compose --env-file .env -f docker/compose.yaml up -d
# 密码只放在 .env。MYSQL_ROOT_PASSWORD 只在数据卷第一次初始化时生效。

name: learn-langchain

services:
  mysql:
    image: mysql:8.4
    container_name: langchain-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在仓库根目录的 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-langchain}
      TZ: Asia/Shanghai
    ports:
      # 只绑定本机，避免局域网其它机器直接访问
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅当数据卷为空时才会执行其中的 *.sql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
