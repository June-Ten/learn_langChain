# 本地开发用 MySQL
# 用法（在仓库根目录）：docker compose -f docker/compose.yaml up -d
# 注意：.env 已在 .gitignore 中，密码不要写进本文件

name: learn-langchain

services:
  mysql:
    image: mysql:8.4
    container_name: langchain-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-langchain}
      TZ: Asia/Shanghai
    ports:
      # 只绑定本机，避免局域网其它机器直接访问
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅当数据卷为空时才会执行其中的 *.sql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
